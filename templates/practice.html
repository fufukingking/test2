
{% extends "layout.html" %}

{% block title %}
    练习 - {{ section["title"] }}
{% endblock %}

{% block main %}

<div class="game-page">

    <!-- ================================================== -->
    <!-- HEADER -->
    <!-- ================================================== -->

    <div class="game-header">

        <div>
            <h1>{{ section["title"] }}</h1>
            <p>尽快点击中文词汇！</p>
        </div>

        <div class="score-box">
            ⭐ <span id="score">0</span>
        </div>

    </div>


    <!-- ================================================== -->
    <!-- GAME AREA -->
    <!-- ================================================== -->

    <div id="game-area">

        <button
            id="vocabulary"
            type="button"
        >

            <span
                id="chinese"
                class="chinese"
            >
                {{ vocabulary["chinese"] }}
            </span>

        </button>

    </div>


    <!-- ================================================== -->
    <!-- FOOTER -->
    <!-- ================================================== -->

    <div class="game-footer">

        <a
            href="{{ url_for('routes.section', section_id=section['id']) }}"
            class="btn btn-outline-secondary"
        >
            ← 返回学习单元
        </a>

    </div>

</div>


<!-- ====================================================== -->
<!-- STYLE -->
<!-- ====================================================== -->

<style>

    body {
        overflow: hidden;
    }


    .game-page {
        width: 100%;
        height: 90vh;

        display: flex;
        flex-direction: column;
    }


    /* ================================================== */
    /* HEADER */
    /* ================================================== */

    .game-header {

        display: flex;

        justify-content: space-between;

        align-items: center;

        padding: 20px 30px;
    }


    .game-header h1 {
        margin: 0;
    }


    .game-header p {

        margin: 5px 0 0;

        color: #777;

        font-size: 18px;
    }


    /* ================================================== */
    /* SCORE */
    /* ================================================== */

    .score-box {

        font-size: 30px;

        font-weight: bold;

        padding: 10px 20px;

        border-radius: 14px;

        background: #f5f5f5;

        box-shadow:
            0 3px 10px rgba(0, 0, 0, 0.08);
    }


    /* ================================================== */
    /* GAME AREA */
    /* ================================================== */

    #game-area {

        position: relative;

        flex: 1;

        margin: 0 20px 20px;

        border: 2px solid #ddd;

        border-radius: 20px;

        background: #f7f7f7;

        overflow: hidden;
    }


    /* ================================================== */
    /* VOCABULARY BUTTON */
    /* ================================================== */

    #vocabulary {

        position: absolute;

        display: flex;

        align-items: center;

        justify-content: center;

        min-width: 170px;

        min-height: 110px;

        padding: 20px 30px;

        border: none;

        border-radius: 18px;

        background: white;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.18);

        cursor: pointer;

        user-select: none;

        transition:
            transform 0.1s ease,
            box-shadow 0.1s ease;
    }


    #vocabulary:hover {

        transform: scale(1.08);

        box-shadow:
            0 12px 30px rgba(0, 0, 0, 0.25);
    }


    #vocabulary:active {

        transform: scale(0.94);
    }


    #vocabulary:disabled {

        cursor: wait;

        opacity: 0.8;
    }


    /* ================================================== */
    /* CHINESE */
    /* ================================================== */

    .chinese {

        display: block;

        font-size: 50px;

        font-weight: bold;

        line-height: 1.2;
    }


    /* ================================================== */
    /* FOOTER */
    /* ================================================== */

    .game-footer {

        padding: 0 30px 20px;
    }


    /* ================================================== */
    /* MOBILE */
    /* ================================================== */

    @media (max-width: 600px) {

        .game-header {

            padding: 15px;

        }


        .game-header h1 {

            font-size: 24px;

        }


        .game-header p {

            font-size: 15px;

        }


        .score-box {

            font-size: 22px;

            padding: 8px 14px;

        }


        #game-area {

            margin: 0 10px 15px;

        }


        #vocabulary {

            min-width: 140px;

            min-height: 90px;

            padding: 15px 20px;

        }


        .chinese {

            font-size: 40px;

        }


        .game-footer {

            padding: 0 15px 15px;

        }

    }

</style>


<!-- ====================================================== -->
<!-- JAVASCRIPT -->
<!-- ====================================================== -->

<script>

    const gameArea =
        document.getElementById("game-area");

    const vocabulary =
        document.getElementById("vocabulary");

    const chinese =
        document.getElementById("chinese");

    const scoreElement =
        document.getElementById("score");


    let score = 0;

    let playing = false;


    // ======================================================
    // RANDOM POSITION
    // ======================================================

    function moveVocabulary() {

        const areaWidth =
            gameArea.clientWidth;

        const areaHeight =
            gameArea.clientHeight;


        const vocabularyWidth =
            vocabulary.offsetWidth;

        const vocabularyHeight =
            vocabulary.offsetHeight;


        const maxX =
            Math.max(
                areaWidth - vocabularyWidth,
                0
            );


        const maxY =
            Math.max(
                areaHeight - vocabularyHeight,
                0
            );


        const randomX =
            Math.floor(
                Math.random() * maxX
            );


        const randomY =
            Math.floor(
                Math.random() * maxY
            );


        vocabulary.style.left =
            randomX + "px";


        vocabulary.style.top =
            randomY + "px";
    }


    // ======================================================
    // SPEAK CHINESE
    // ======================================================

    function speakChinese(word) {

        return new Promise(function(resolve) {

            /*
             * Alte Aussprache stoppen.
             */

            window.speechSynthesis.cancel();


            const speech =
                new SpeechSynthesisUtterance(word);


            /*
             * Chinesische Aussprache.
             */

            speech.lang = "zh-CN";


            /*
             * Etwas langsamer, damit die Aussprache
             * besser verständlich ist.
             */

            speech.rate = 0.85;

            speech.pitch = 1;


            /*
             * Erst weitermachen, wenn die Aussprache
             * beendet wurde.
             */

            speech.onend = function() {

                resolve();

            };


            /*
             * Falls der Browser einen Fehler bekommt,
             * darf das Spiel trotzdem weitermachen.
             */

            speech.onerror = function() {

                resolve();

            };


            window.speechSynthesis.speak(
                speech
            );

        });

    }


    // ======================================================
    // NEXT VOCABULARY
    // ======================================================

    async function nextVocabulary() {

        /*
         * Während der Aussprache darf nicht
         * mehrfach geklickt werden.
         */

        if (playing) {

            return;

        }


        playing = true;

        vocabulary.disabled = true;


        /*
         * Das Wort merken, das gerade angeklickt wurde.
         */

        const clickedWord =
            chinese.textContent.trim();


        try {

            /*
             * Punkt speichern und gleichzeitig
             * nächste Vokabel vom Server holen.
             */

            const response =
                await fetch(
                    "{{ url_for('routes.practice_point', section_id=section['id']) }}",
                    {
                        method: "POST"
                    }
                );


            if (!response.ok) {

                console.error(
                    "Die nächste Vokabel konnte nicht geladen werden."
                );

                playing = false;

                vocabulary.disabled = false;

                return;

            }


            const data =
                await response.json();


            /*
             * Punkt erhöhen.
             */

            score++;

            scoreElement.textContent =
                score;


            /*
             * WICHTIG:
             *
             * Erst das angeklickte Wort aussprechen.
             */

            await speakChinese(
                clickedWord
            );


            /*
             * Erst NACH der Aussprache
             * kommt das neue Wort.
             */

            chinese.textContent =
                data.chinese;


            /*
             * Neue zufällige Position.
             */

            moveVocabulary();


        } catch (error) {

            console.error(
                "Fehler:",
                error
            );

        }


        /*
         * Spieler darf wieder klicken.
         */

        playing = false;

        vocabulary.disabled = false;

    }


    // ======================================================
    // CLICK EVENT
    // ======================================================

    vocabulary.addEventListener(
        "click",
        nextVocabulary
    );


    // ======================================================
    // START POSITION
    // ======================================================

    window.addEventListener(
        "load",
        function() {

            moveVocabulary();

        }
    );


    // ======================================================
    // WINDOW RESIZE
    // ======================================================

    window.addEventListener(
        "resize",
        function() {

            moveVocabulary();

        }
    );

</script>

{% endblock %}
