{% extends "layout.html" %}


{% block title %}
教师管理 - 中文学习
{% endblock %}


{% block main %}

<div class="container-fluid">

    <!-- Admin header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="h2 mb-1">
                教师管理
            </h1>

            <p class="text-secondary mb-0">
                管理学习单元和中文词汇
            </p>

        </div>


        <a
            href="/"
            class="btn btn-outline-secondary"
        >
            返回学习平台
        </a>

    </div>


    <!-- Admin navigation -->

    <ul class="nav nav-tabs mb-4">

        <li class="nav-item">

            <a
                class="nav-link {% if request.path == '/admin' %}active{% endif %}"
                href="/admin"
            >
                📊 管理首页
            </a>

        </li>


        <li class="nav-item">

            <a
                class="nav-link {% if '/create' in request.path %}active{% endif %}"
                href="/admin/section/create"
            >
                ＋ 新建单元
            </a>

        </li>


        <li class="nav-item">

            <a
                class="nav-link"
                href="/sections"
            >
                📚 所有单元
            </a>

        </li>


        <li class="nav-item">

            <a
                class="nav-link"
                href="/leaderboard"
            >
                🏆 排行榜
            </a>

        </li>

    </ul>


    <!-- Admin content -->

    {% block admin_main %}{% endblock %}

</div>

{% endblock %}
```
